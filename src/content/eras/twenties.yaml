title: Двадцатые
shortTitle: 2020-е
from: 2020
to: null
range: с 2020
description: >-
  Atomic Heart вышел на PlayStation 5 и попал в мировые чарты, «Смута» стала
  первой большой игрой на государственные деньги, а INDIKA, Loop Hero, Black
  Book, Potion Craft и Selfloss показали, что независимые команды из Перми,
  Алма-Аты и Еревана говорят с миром на одном языке. Студии переезжают,
  меняют юрисдикции и движки: почти всё новое сделано на Unreal Engine 5 и Unity.
