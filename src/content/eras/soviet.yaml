title: Советская эпоха
shortTitle: До 1991
from: 1970
to: 1991
range: до 1991
description: >-
  Игры рождались в НИИ и вузах на машинах, которых не было в магазинах: «Тетрис»
  написан на «Электронике-60» в Вычислительном центре Академии наук, первые
  домашние программы расходились на кассетах для БК-0010 и клонов ZX Spectrum,
  а миллионы детей играли в «Ну, погоди!» на карманной «Электронике» и в
  «Морской бой» в парках. Индустрии ещё нет — есть авторы-одиночки и кооперативы.
accent: '#2f7d3f'
band: '#dcd7c4'
fonts:
  - file: tektur-700-cyrillic.woff2
    family: Tektur
    weight: '700'
  - file: pt-sans-400-cyrillic.woff2
    family: PT Sans
    weight: '400'
  - file: pt-mono-400-cyrillic.woff2
    family: PT Mono
    weight: '400'
styleNote: >-
  Оформление в духе советской вычислительной техники: бежевый пластик БК-0010,
  зелёное свечение люминофора на тёмном экране, машинный шрифт и строчки-полосы
  развёртки. Заголовки набраны рубленым техно-гротеском, как надписи на
  корпусах «Электроники».
motifs:
  - Электроника-60 и «Тетрис» 1984 года
  - БК-0010 и кассетный магнитофон
  - Клоны ZX Spectrum, спаянные дома
  - «Ну, погоди!» на Электронике ИМ-02
  - Автомат «Морской бой» в парке
