title: Нулевые
shortTitle: 2000-е
from: 2000
to: 2010
range: 2000–2009
description: >-
  Золотое десятилетие: «Ил-2 Штурмовик», «Космические рейнджеры», «Блицкриг»,
  «Периметр», «Мор. Утопия», Heroes of Might and Magic V, S.T.A.L.K.E.R.,
  «В тылу врага», «Корсары». Игры продавались в jewel-боксах за сто рублей,
  о них писали «Игромания» и «Страна игр», а компьютерные клубы стояли в каждом
  районе. К концу десятилетия кризис 2008 года закрыл половину студий.
accent: '#f26b1d'
band: '#dfe4ea'
fonts:
  - file: exo-2-800-cyrillic.woff2
    family: Exo 2
    weight: '800'
  - file: ubuntu-400-cyrillic.woff2
    family: Ubuntu
    weight: '400'
  - file: ubuntu-700-cyrillic.woff2
    family: Ubuntu
    weight: '700'
styleNote: >-
  Глянец середины нулевых: серебристые градиенты, оранжевый акцент в духе
  S.T.A.L.K.E.R. и игровых журналов, «технологичный» рубленый гротеск
  в заголовках, скошенные плашки и лёгкие тени.
motifs:
  - Jewel-бокс с диском и наклейкой «1С»
  - Компьютерный клуб и Counter-Strike по сети
  - Журнал «Игромания» с диском
  - PlayStation 2 и PSP
  - Xbox 360 и первые «сюжетные» трейлеры
