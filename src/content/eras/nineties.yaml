title: Девяностые
shortTitle: 90-е
from: 1991
to: 2000
range: 1991–1999
description: >-
  В страну хлынули Dendy и пиратские диски, а первые студии — Gamos, «Никита»,
  «Дока», K-D Lab — начали делать игры на продажу: «Color Lines», «Братья
  Пилоты», «ГЭГ», «Петька и Василий Иванович». К концу десятилетия появились
  издатели «Бука», «1С» и «Акелла», а «Вангеры», «Аллоды» и «Дальнобойщики»
  показали, что здесь умеют делать большие игры для всего мира.
accent: '#d0202a'
band: '#d9d9d9'
fonts:
  - file: press-start-2p-400-cyrillic.woff2
    family: Press Start 2P
    weight: '400'
  - file: pt-sans-400-cyrillic.woff2
    family: PT Sans
    weight: '400'
  - file: pt-sans-700-cyrillic.woff2
    family: PT Sans
    weight: '700'
styleNote: >-
  Серый пластик Dendy с красными кнопками и бирюзовый рабочий стол Windows 95:
  пиксельный шрифт восьмибитных приставок в заголовках, синие плашки как
  у окон, объёмные рамки и никаких скруглений.
motifs:
  - Приставка Dendy и картридж «9999 в 1»
  - Клон ZX Spectrum «Пентагон» и телевизор «Рубин»
  - Дискета 3,5 дюйма и коробка Windows 95
  - Пиратский диск с «Русской версией»
  - Монитор с электронно-лучевой трубкой
